<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>UK FleetFix</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <nav class="bg-slate-950 border-b border-slate-800 p-4 flex justify-between items-center"><span class="font-bold text-xl text-white">UK<span class="text-amber-500">FleetFix</span></span><button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-lg font-bold">Get Featured (£25/mo)</button></nav>
  <main class="max-w-6xl mx-auto p-6"><h1 class="text-3xl font-extrabold text-white mb-6">24/7 Commercial Fleet Directory</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-slate-950 border border-amber-500 p-4 rounded-xl"><img src="images/hydraquip.svg" class="h-32 w-full object-cover rounded-lg mb-3"><h2 class="text-xl font-bold text-white">Hydraquip</h2><p class="text-slate-400 text-sm">24/7 Mobile Hydraulic Repair</p><a href="tel:03458120212" class="block mt-4 text-center bg-amber-500 text-slate-950 py-2 rounded-lg font-bold">Call 0345 812 0212</a></div>
      <div class="bg-slate-950 border border-amber-500 p-4 rounded-xl"><img src="images/man_mobile24.svg" class="h-32 w-full object-cover rounded-lg mb-3"><h2 class="text-xl font-bold text-white">MAN Mobile24</h2><p class="text-slate-400 text-sm">Emergency Fleet Recovery</p><a href="tel:0080066245324" class="block mt-4 text-center bg-amber-500 text-slate-950 py-2 rounded-lg font-bold">Call 00800 66245324</a></div>
    </div>
  </main>
  <div id="modal" class="fixed inset-0 bg-slate-950/80 hidden flex items-center justify-center p-4"><div class="bg-slate-900 p-6 rounded-2xl max-w-md w-full border border-amber-500">
    <h3 class="text-xl font-bold text-white mb-4">Authorize Direct Debit (£25/mo)</h3>
    <form onsubmit="handleCheckout(event)"><input id="gcName" required placeholder="Company Name" class="w-full mb-3 p-2 bg-slate-950 border border-slate-700 text-white rounded-lg"><input id="gcEmail" type="email" required placeholder="Billing Email" class="w-full mb-4 p-2 bg-slate-950 border border-slate-700 text-white rounded-lg"><button type="submit" id="gcBtn" class="w-full bg-amber-500 text-slate-950 py-3 font-bold rounded-lg">Authorize GoCardless</button></form>
  </div></div>
  <script>
    async function handleCheckout(e) { e.preventDefault(); document.getElementById('gcBtn').innerText = "Connecting..."; const res = await fetch("/api/create-gocardless-flow", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ companyName: document.getElementById('gcName').value, email: document.getElementById('gcEmail').value }) }); const data = await res.json(); if(data.authorisation_url) window.location.href = data.authorisation_url; else alert("Error: " + data.error); }
  </script>
</body></html>
